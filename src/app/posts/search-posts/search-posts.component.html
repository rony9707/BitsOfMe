<div class="search-container">
  <input type="text" #searchPost (input)="searchText(searchPost)" 
         placeholder="Search Posts..." [(ngModel)]="searchInput"/>
  @if(searchPost.value.length!=0){
    <div class="delete-search-text" (click)="clearSearchText(searchPost)" >
      <app-close-button></app-close-button>
    </div>
  }       
</div>
